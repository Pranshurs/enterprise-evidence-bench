[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-evidence-bench"
version = "0.0.1.dev0"
description = "Cross-source enterprise evidence benchmark: relational data + governed documents under per-principal authorization."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pranshu Raj" }]
dependencies = [
    "PyYAML>=6",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlglot>=26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
eeb = "eeb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeb = ["data/*.txt", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "pg: requires the local Postgres fixture (EEB_PG_ADMIN_DSN)",
    "slow: default-scale runs",
    "docker: requires a Docker daemon (isolation runner)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eeb"]
mypy_path = "src"

# A single hosted witness. The full matrix (Python 3.11-3.14 with PostgreSQL 17 and
# Docker isolation required) runs locally; see docs/evidence/.
name: witness
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy --strict src
      - run: python -m pytest -q -m "not docker and not pg"
